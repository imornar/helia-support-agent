stages: [validate]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

consistency:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install --quiet pyyaml==6.0.2 jsonschema==4.25.1
    - python3 scripts/validate.py
